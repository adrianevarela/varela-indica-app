<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Painel Varela Indica</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#e91e63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Varela Indica">
<style>
  :root { --fundo:#fff5f8; --card:#fff; --texto:#2b1b22; --suave:#7a6670; --linha:#f1dde5; --rosa:#e91e63; --verde:#1b8a4b; --alerta:#b45309; --alerta-fundo:#fff4e0; }
  @media (prefers-color-scheme: dark) { :root { --fundo:#1c1418; --card:#2a1f24; --texto:#fbeef3; --suave:#c4adb7; --linha:#3d2c33; --verde:#4ade80; --alerta:#fbbf24; --alerta-fundo:#3a2a10; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--fundo); color:var(--texto); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:1.5rem; margin:0 0 2px; }
  .sub { color:var(--suave); margin:0 0 18px; font-size:.9rem; }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:18px; }
  .kpi { background:var(--card); border-radius:14px; padding:12px 14px; box-shadow:0 1px 6px rgb(0 0 0/.06); }
  .kpi b { display:block; font-size:1.5rem; font-variant-numeric:tabular-nums; }
  .kpi span { color:var(--suave); font-size:.85rem; }
  .aviso { background:var(--alerta-fundo); color:var(--alerta); border-radius:12px; padding:10px 14px; margin-bottom:16px; font-weight:600; display:none; }
  h2 { font-size:1.1rem; margin:22px 0 10px; }
  .lista { display:flex; flex-direction:column; gap:8px; }
  .item { display:grid; grid-template-columns:56px 1fr auto; gap:12px; align-items:center; background:var(--card); border-radius:14px; padding:10px; box-shadow:0 1px 6px rgb(0 0 0/.06); }
  .item img { width:56px; height:56px; object-fit:contain; background:#fff; border-radius:10px; }
  .nome { font-weight:600; }
  .meta { color:var(--suave); font-size:.82rem; }
  .dir { text-align:right; font-variant-numeric:tabular-nums; }
  .preco { color:var(--rosa); font-weight:700; }
  .com { color:var(--verde); font-size:.82rem; font-weight:600; }
  .tag { display:inline-block; font-size:.72rem; padding:1px 7px; border-radius:999px; background:var(--linha); margin-left:4px; }
  .hoje { outline:2px solid var(--rosa); }
  a { color:var(--rosa); }
  .links { display:flex; flex-wrap:wrap; gap:8px; margin-top:24px; }
  .links a { background:var(--card); padding:8px 12px; border-radius:10px; text-decoration:none; font-weight:600; box-shadow:0 1px 6px rgb(0 0 0/.06); }
  .vazio { color:var(--suave); padding:12px; }
  /* abas */
  .abas { display:flex; gap:6px; margin:0 0 16px; background:var(--card); padding:4px; border-radius:12px; box-shadow:0 1px 6px rgb(0 0 0/.06); }
  .abas button { flex:1; border:0; background:none; color:var(--texto); font:600 .95rem system-ui,sans-serif; padding:9px; border-radius:9px; cursor:pointer; }
  .abas button[aria-selected="true"] { background:var(--rosa); color:#fff; }
  /* ganhos */
  :root { --barra:#e91e63; --grade:#f1dde5; --ok:#1b8a4b; --pend:#b45309; --canc:#b42318; }
  @media (prefers-color-scheme: dark) { :root { --barra:#f06292; --grade:#3d2c33; --ok:#4ade80; --pend:#fbbf24; --canc:#f87171; } }
  .senha { background:var(--card); border-radius:14px; padding:18px; box-shadow:0 1px 6px rgb(0 0 0/.06); max-width:420px; }
  .senha input[type=password] { width:100%; font-size:1rem; padding:10px 12px; border-radius:10px; border:1px solid var(--linha); background:var(--fundo); color:var(--texto); margin:8px 0; }
  .senha button, .btn-sair { background:var(--rosa); color:#fff; border:0; border-radius:10px; padding:10px 16px; font-weight:600; font-size:.95rem; cursor:pointer; }
  .btn-sair { background:var(--card); color:var(--texto); box-shadow:0 1px 6px rgb(0 0 0/.06); padding:6px 12px; font-size:.82rem; }
  .erro { color:var(--canc); font-weight:600; min-height:1.2em; }
  .lembrar { display:flex; gap:6px; align-items:center; color:var(--suave); font-size:.85rem; margin-bottom:10px; }
  .cartao { background:var(--card); border-radius:14px; padding:14px; box-shadow:0 1px 6px rgb(0 0 0/.06); }
  .status { display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:8px; }
  .status .cartao b { display:block; font-size:1.25rem; font-variant-numeric:tabular-nums; }
  .status .cartao span { font-size:.85rem; color:var(--suave); }
  .st-ok { border-left:4px solid var(--ok); } .st-pend { border-left:4px solid var(--pend); } .st-canc { border-left:4px solid var(--canc); }
  .grafico { position:relative; }
  .grafico svg { display:block; max-width:100%; height:auto; }
  .grafico .dica { position:absolute; pointer-events:none; background:var(--texto); color:var(--fundo); font-size:.8rem; padding:5px 8px; border-radius:8px; white-space:nowrap; transform:translate(-50%,-110%); display:none; font-variant-numeric:tabular-nums; }
  .barras-h .linha { display:grid; grid-template-columns:1fr auto; gap:4px 10px; margin-bottom:10px; font-size:.9rem; }
  .barras-h .trilho { grid-column:1 / -1; height:8px; background:var(--grade); border-radius:4px; overflow:hidden; }
  .barras-h .trilho i { display:block; height:100%; background:var(--barra); border-radius:4px; }
  .valor { font-variant-numeric:tabular-nums; font-weight:600; }
  .pill { font-size:.72rem; font-weight:700; padding:1px 8px; border-radius:999px; white-space:nowrap; }
  .pill.ok { color:var(--ok); border:1px solid var(--ok); } .pill.pend { color:var(--pend); border:1px solid var(--pend); } .pill.canc { color:var(--canc); border:1px solid var(--canc); }
  /* posts: alertas, proximo, calendario, cartoes de post */
  .alerta { background:var(--alerta-fundo); color:var(--alerta); border-radius:12px; padding:9px 14px; margin-bottom:8px; font-weight:600; font-size:.9rem; }
  .proximo { background:var(--rosa); color:#fff; border-radius:14px; padding:12px 14px; margin-bottom:14px; font-weight:600; display:flex; gap:12px; align-items:center; }
  .proximo img { width:44px; height:44px; border-radius:8px; object-fit:contain; background:#fff; }
  .proximo small { display:block; font-weight:500; opacity:.9; }
  .calendario { display:grid; grid-template-columns:44px repeat(7, minmax(0,1fr)); gap:4px; font-size:.72rem; overflow-x:auto; }
  .calendario .cab { text-align:center; color:var(--suave); font-weight:700; padding-bottom:2px; }
  .calendario .cab.hj { color:var(--rosa); }
  .calendario .hora { color:var(--suave); font-weight:700; align-self:center; }
  .calendario .slot { aspect-ratio:1; border-radius:8px; background:var(--fundo); display:grid; place-items:center; overflow:hidden; position:relative; border:1px solid var(--linha); }
  .calendario .slot img { width:100%; height:100%; object-fit:contain; background:#fff; }
  .calendario .slot.vazio-slot { border:1px dashed var(--alerta); color:var(--alerta); font-weight:700; }
  .calendario .slot .ok { position:absolute; right:2px; bottom:2px; background:var(--ok); color:#fff; border-radius:999px; font-size:.6rem; padding:0 4px; }
  .post { background:var(--card); border-radius:14px; padding:10px; box-shadow:0 1px 6px rgb(0 0 0/.06); display:grid; grid-template-columns:72px 1fr; gap:12px; }
  .post .capa { width:72px; height:128px; object-fit:cover; border-radius:10px; background:var(--linha); }
  .post .icones { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0; }
  .post .icones span { font-size:.72rem; padding:1px 7px; border-radius:999px; border:1px solid var(--linha); }
  .post .icones .sim { border-color:var(--ok); color:var(--ok); } .post .icones .nao { border-color:var(--canc); color:var(--canc); }
  .post .nums { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:.82rem; font-variant-numeric:tabular-nums; margin:4px 0; }
  .post .botoes { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .post .botoes a { font-size:.78rem; font-weight:600; text-decoration:none; padding:4px 10px; border-radius:8px; background:var(--fundo); border:1px solid var(--linha); color:var(--texto); }
  .delta { font-size:.8rem; font-weight:600; } .delta.up { color:var(--ok); } .delta.down { color:var(--canc); }
  .topo-ganhos { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📊 Painel Varela Indica</h1>
  <p class="sub" id="atualizado">Carregando…</p>
  <div class="abas" role="tablist">
    <button role="tab" id="tab-posts" aria-selected="true" onclick="mostrarAba('posts')">📬 Posts</button>
    <button role="tab" id="tab-ganhos" aria-selected="false" onclick="mostrarAba('ganhos')">💰 Ganhos</button>
  </div>
  <section id="aba-posts">
  <div id="alertas"></div>
  <div class="proximo" id="proximo-post"></div>
  <div class="kpis" id="kpis"></div>
  <h2>📅 Calendário</h2>
  <div class="cartao calendario" id="calendario"></div>
  <h2>📈 Seguidores (30 dias)</h2>
  <div class="cartao grafico" id="grafico-seguidores"></div>
  <h2>🏆 Posts com mais visualizações</h2>
  <div class="lista" id="ranking"></div>
  <h2>🕐 Melhor horário</h2>
  <div class="cartao barras-h" id="horarios"></div>
  <h2>⏭️ Próximos posts</h2>
  <div class="lista" id="proximos"></div>
  <h2>✅ Já postados</h2>
  <div class="lista" id="postados"></div>
  </section>
  <section id="aba-ganhos" hidden>
    <form class="senha" id="form-senha" onsubmit="event.preventDefault(); abrirGanhos(this.senha.value, this.lembrar.checked)">
      <div class="nome">🔒 Ganhos protegidos</div>
      <div class="meta">Digite a senha que você salvou no GitHub (PAINEL_SENHA).</div>
      <input type="password" name="senha" autocomplete="current-password" placeholder="Senha" required>
      <label class="lembrar"><input type="checkbox" name="lembrar"> Lembrar neste aparelho</label>
      <button type="submit">Abrir</button>
      <div class="erro" id="erro-senha"></div>
    </form>
    <div id="ganhos" hidden></div>
  </section>
  <div class="links">
    <a href="https://github.com/adrianevarela/varela-indica-app/actions" target="_blank" rel="noopener">⚙️ Execuções (verde/vermelho)</a>
    <a href="./" target="_blank" rel="noopener">🛒 Página link na bio</a>
    <a href="https://www.instagram.com/varelaindica/" target="_blank" rel="noopener">📸 Instagram</a>
  </div>
</div>
<script>
const BASE = "https://raw.githubusercontent.com/adrianevarela/varela-indica-app/main/";
const brl = v => "R$ " + Number(v).toFixed(2).replace(".", ",");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const desconto = t => (String(t || "").match(/\(-(\d+)%\)/) || [])[1];
const quando = q => new Date(q.replace(" ", "T") + ":00-03:00");
const fmt = d => d.toLocaleString("pt-BR", { weekday:"short", day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit", timeZone:"America/Sao_Paulo" });

const num = v => v == null ? "—" : Number(v).toLocaleString("pt-BR");
const chaveDiaP = d => d.toLocaleDateString("sv-SE", { timeZone: "America/Sao_Paulo" });
const horaBR = d => +d.toLocaleString("pt-BR", { hour: "2-digit", hour12: false, timeZone: "America/Sao_Paulo" });
let DADOS = { fila: [], estado: {}, metricas: {} };  // usados tambem pela aba Ganhos

function linha(p, extra) {
  const d = desconto(p.texto);
  return `<a class="item ${extra.cls || ""}" href="${esc(p.link)}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">
    ${p.foto ? `<img src="${esc(p.foto)}" alt="" loading="lazy">` : "<span></span>"}
    <div><div class="nome">${esc(p.produto)}<span class="tag">${esc(p.loja || "Mercado Livre")}</span></div>
      <div class="meta">${extra.meta}</div></div>
    <div class="dir"><div class="preco">${esc(p.preco || "")}</div>
      ${d ? `<div class="meta">-${d}%</div>` : ""}
      ${p.comissao ? `<div class="com">+${brl(p.comissao)}/venda</div>` : ""}</div></a>`;
}

function cartaoPost(p, m, feitos) {
  const it = p.item || {};
  const tg = feitos.has("tg | " + p.chave);
  const icone = (ok, txt) => `<span class="${ok ? "sim" : "nao"}">${ok ? "✓" : "✗"} ${txt}</span>`;
  const nums = [["👁", m.views, "visualizações"], ["❤", m.curtidas, "curtidas"], ["💬", m.comentarios, "comentários"],
                ["🔖", m.salvos, "salvos"], ["↗", m.compartilhamentos, "compartilhamentos"], ["👥", m.alcance, "alcance"]]
    .filter(([, v]) => v != null).map(([i, v, t]) => `<span title="${t}">${i} ${num(v)}</span>`).join("");
  return `<div class="post">
    <img class="capa" src="${esc(m.capa || p.foto || it.foto || "")}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
    <div><div class="nome">nº ${p.numero} · ${esc(p.produto)}</div>
      <div class="meta">${fmt(new Date(p.em))} · ${esc(p.preco || "")} <span class="tag">${esc(p.loja || "Mercado Livre")}</span></div>
      <div class="icones">${icone(p.reel, "Reels")}${icone(p.story, "Story")}${icone(p.facebook, "Facebook")}${icone(tg, "Telegram")}</div>
      ${nums ? `<div class="nums">${nums}</div>` : `<div class="meta">Métricas aparecem algumas horas depois do post.</div>`}
      ${m.story ? `<div class="meta">Story: ${num(m.story.alcance)} pessoas alcançadas · ${num(m.story.respostas)} respostas</div>` : ""}
      ${m.views_fb != null ? `<div class="meta">Facebook: ${num(m.views_fb)} visualizações</div>` : ""}
      <div class="botoes">
        ${m.link_ig ? `<a href="${esc(m.link_ig)}" target="_blank" rel="noopener">📸 Abrir no Instagram</a>` : ""}
        ${m.link_fb ? `<a href="${esc(m.link_fb)}" target="_blank" rel="noopener">📘 Abrir no Facebook</a>` : ""}
        <a href="${esc(p.link)}" target="_blank" rel="noopener">🛒 Produto</a>
      </div></div></div>`;
}

function calendario(fila, publicados, agora) {
  const porHorario = {};
  fila.forEach(i => { porHorario[i.quando] = { foto: i.foto, nome: i.produto }; });
  publicados.forEach(p => { const k = (p.chave || "").split(" | ")[0]; if (k) porHorario[k] = { foto: p.foto, nome: p.produto, ok: true }; });
  const dias = [];
  for (let i = 0; i < 7; i++) dias.push(new Date(agora.getTime() + i * 864e5));
  let h = `<div></div>` + dias.map((d, i) => `<div class="cab ${i === 0 ? "hj" : ""}">${i === 0 ? "Hoje" : d.toLocaleDateString("pt-BR", { weekday: "short", timeZone: "America/Sao_Paulo" }).replace(".", "")}<br>${d.toLocaleDateString("pt-BR", { day: "2-digit", timeZone: "America/Sao_Paulo" })}</div>`).join("");
  for (const hora of [11, 15, 20]) {
    h += `<div class="hora">${hora}h</div>`;
    for (const d of dias) {
      const k = `${chaveDiaP(d)} ${String(hora).padStart(2, "0")}:00`, s = porHorario[k];
      const t = new Date(k.replace(" ", "T") + ":00-03:00"), passou = t < agora;
      const urgente = !passou && t - agora < 2 * 864e5;  // a Shopee preenche 3 dias a frente: vazio so preocupa se for logo
      h += s ? `<div class="slot" title="${esc(s.nome)}">${s.foto ? `<img src="${esc(s.foto)}" alt="" loading="lazy">` : esc(s.nome.slice(0, 10))}${s.ok ? `<span class="ok">✓</span>` : ""}</div>`
             : `<div class="slot ${urgente ? "vazio-slot" : ""}" title="${urgente ? "Horário vazio" : passou ? "" : "A Shopee preenche mais perto do dia"}">${urgente ? "vazio" : passou ? "" : "·"}</div>`;
    }
  }
  return h;
}

async function alertasGitHub() {
  try {
    const r = await fetch("https://api.github.com/repos/adrianevarela/varela-indica-app/actions/runs?per_page=30").then(r => r.json());
    const limite = Date.now() - 24 * 3600e3;
    return (r.workflow_runs || []).filter(x => x.conclusion === "failure" && new Date(x.created_at) > limite)
      .map(x => `❌ Falhou: ${x.name} (${fmt(new Date(x.created_at))}) — <a href="${esc(x.html_url)}" target="_blank" rel="noopener">ver motivo</a>`);
  } catch (e) { return []; }
}

function contagem(proximos) {
  const el = document.getElementById("proximo-post");
  const p = proximos[0];
  if (!p) { el.style.display = "none"; return; }
  el.style.display = "flex";
  const atualizar = () => {
    const ms = quando(p.quando) - new Date();
    const h = Math.floor(ms / 3600e3), mi = Math.max(0, Math.floor(ms % 3600e3 / 60e3));
    el.innerHTML = `${p.foto ? `<img src="${esc(p.foto)}" alt="">` : ""}<div>⏱️ Próximo post ${ms > 0 ? `em ${h > 0 ? h + "h" : ""}${String(mi).padStart(h > 0 ? 2 : 1, "0")}${h > 0 ? "" : " min"}` : "saindo agora"}<small>${esc(p.produto)} · ${fmt(quando(p.quando))}</small></div>`;
  };
  atualizar();
  clearInterval(contagem.t); contagem.t = setInterval(atualizar, 30e3);
}

async function carregar() {
  const pegar = n => fetch(BASE + n + "?t=" + Date.now()).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  const [fila, estado, metricas, alertas] = await Promise.all([pegar("fila.json"), pegar("estado.json"), pegar("docs/metricas.json"), alertasGitHub()]);
  DADOS = { fila: Array.isArray(fila) ? fila : [], estado, metricas };
  const agora = new Date();
  const feitos = new Set(estado.feitos || []);
  const jaFoi = i => [...feitos].some(f => f.endsWith(`| ${i.quando} | ${i.produto}`));
  const proximos = DADOS.fila.filter(i => quando(i.quando) > agora && !jaFoi(i)).sort((a, b) => quando(a.quando) - quando(b.quando));
  const postados = (estado.publicados || []).slice().sort((a, b) => b.numero - a.numero);
  const mp = (metricas.posts || {});
  const hist = Object.entries(metricas.historico || {}).sort();
  const hojeStr = chaveDiaP(agora);

  // alertas
  const ultimo = proximos.length ? quando(proximos[proximos.length - 1].quando) : null;
  const diasFila = ultimo ? Math.max(0, Math.round((ultimo - agora) / 864e5 * 10) / 10) : 0;
  if (!proximos.length || diasFila < 1) alertas.push("⚠️ A fila está acabando. Confira se o robô da Shopee rodou às 6h.");
  postados.filter(p => new Date(p.em) > agora - 864e5 && (!p.reel || !p.facebook))
    .forEach(p => alertas.push(`⚠️ O post nº ${p.numero} (${esc(p.produto)}) não saiu ${!p.reel ? "no Instagram" : "no Facebook"}.`));
  document.getElementById("alertas").innerHTML = alertas.map(a => `<div class="alerta">${a}</div>`).join("");

  contagem(proximos);

  // numeros do topo
  const ha = n => { const alvo = chaveDiaP(new Date(agora - n * 864e5)); const e = hist.filter(([d]) => d <= alvo).pop(); return e ? e[1] : {}; };
  const hoje = (hist[hist.length - 1] || [])[1] || {};
  const delta = (a, b) => (a != null && b != null) ? a - b : null;
  const seta = d => d == null ? "" : `<span class="delta ${d >= 0 ? "up" : "down"}">${d >= 0 ? "▲" : "▼"} ${num(Math.abs(d))} em 7 dias</span>`;
  const dSeg = delta(metricas.perfil?.followers_count, ha(7).seguidores), dTg = delta(metricas.telegram, ha(7).telegram);
  const ultimos7 = postados.filter(p => new Date(p.em) > agora - 7 * 864e5);
  const views7 = ultimos7.reduce((a, p) => a + ((mp[p.numero] || {}).views || 0), 0);
  const somaConta = (campo, dias) => hist.slice(-dias - 1, -1).reduce((a, [, h]) => a + ((h.conta || {})[campo] || 0), 0);
  const cliques7 = somaConta("website_clicks", 7), visitas7 = somaConta("profile_views", 7);
  document.getElementById("kpis").innerHTML = [
    [num(metricas.perfil?.followers_count), "seguidores no Instagram", seta(dSeg)],
    [num(metricas.telegram), "membros no Telegram", seta(dTg)],
    [num(views7), "visualizações (posts de 7 dias)", ""],
    [cliques7 ? num(cliques7) : "—", "cliques no link da bio (7 dias)", visitas7 ? `<span class="meta">${num(visitas7)} visitas ao perfil</span>` : ""],
    [postados.length, "posts feitos", ""],
    [ultimo ? `${diasFila} dias` : "0", "de posts garantidos", ""],
  ].map(([v, t, x]) => `<div class="kpi"><b>${v}</b><span>${t}</span>${x ? `<div>${x}</div>` : ""}</div>`).join("");

  document.getElementById("calendario").innerHTML = calendario(DADOS.fila, estado.publicados || [], agora);

  // seguidores: novos por dia
  const serie = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(agora - i * 864e5), k = chaveDiaP(d), ant = chaveDiaP(new Date(agora - (i + 1) * 864e5));
    const a = (metricas.historico || {})[k] || {}, b = (metricas.historico || {})[ant] || {};
    const novo = (a.seguidores != null && b.seguidores != null) ? Math.max(0, a.seguidores - b.seguidores) : 0;
    serie.push({ d, v: novo, total: a.seguidores });
  }
  const gs = document.getElementById("grafico-seguidores");
  if (hist.length < 2) gs.innerHTML = `<div class="meta">O gráfico aparece depois de 2 dias de medição.</div>`;
  else if (typeof desenharGrafico === "function")
    desenharGrafico(gs, serie, d => `<b>${d.d.toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit", timeZone: "America/Sao_Paulo" })}</b> · +${num(d.v)} novos · ${num(d.total)} no total`, "Novos seguidores por dia");

  // ranking por visualizacoes
  const comViews = postados.filter(p => (mp[p.numero] || {}).views != null).sort((a, b) => mp[b.numero].views - mp[a.numero].views).slice(0, 5);
  document.getElementById("ranking").innerHTML = comViews.map((p, i) => `<div class="item">
      <img src="${esc((mp[p.numero] || {}).capa || p.foto)}" alt="" loading="lazy">
      <div><div class="nome">${i + 1}. ${esc(p.produto)}</div><div class="meta">nº ${p.numero} · ${fmt(new Date(p.em))} · ❤ ${num(mp[p.numero].curtidas)} · 🔖 ${num(mp[p.numero].salvos)}</div></div>
      <div class="dir valor">👁 ${num(mp[p.numero].views)}</div></div>`).join("")
    || `<div class="vazio">As visualizações aparecem quando o robô de métricas rodar (a cada 3 horas).</div>`;

  // melhor horario (media de visualizacoes)
  const porHora = { 11: [], 15: [], 20: [] };
  postados.forEach(p => { const v = (mp[p.numero] || {}).views; const h = +((p.chave || "").split(" ")[1] || "0").slice(0, 2); if (v != null && porHora[h]) porHora[h].push(v); });
  const medias = Object.entries(porHora).map(([h, l]) => [h, l.length ? l.reduce((a, b) => a + b, 0) / l.length : null, l.length]);
  const maxM = Math.max(1, ...medias.map(m => m[1] || 0));
  document.getElementById("horarios").innerHTML = medias.some(m => m[1] != null)
    ? medias.map(([h, v, n]) => `<div class="linha"><span>${h}h <span class="meta">(${n} posts)</span></span><span class="valor">${v == null ? "—" : num(Math.round(v)) + " visualizações em média"}</span>
        <div class="trilho"><i style="width:${v ? Math.max(2, v / maxM * 100) : 0}%"></i></div></div>`).join("")
      + `<p class="meta">Na aba 💰 Ganhos você vê também qual horário vende mais.</p>`
    : `<div class="vazio">Aparece quando houver visualizações medidas.</div>`;

  document.getElementById("proximos").innerHTML = proximos.map(p => linha(p, {
    meta: fmt(quando(p.quando)), cls: chaveDiaP(quando(p.quando)) === hojeStr ? "hoje" : ""
  })).join("") || `<div class="vazio">Fila vazia — o robô da Shopee preenche às 6h.</div>`;

  document.getElementById("postados").innerHTML = postados.slice(0, 30).map(p => cartaoPost(
    Object.assign({}, p, { foto: p.foto || (p.item || {}).foto }), mp[p.numero] || {}, feitos)).join("")
    || `<div class="vazio">Nenhum post ainda.</div>`;

  document.getElementById("atualizado").textContent = "Atualizado " + fmt(agora) + (metricas.gerado ? " · métricas de " + fmt(new Date(metricas.gerado)) : "");
  if (typeof redesenharGanhos === "function") redesenharGanhos();
}if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
// ao voltar para o app, atualiza os dados
document.addEventListener("visibilitychange", () => { if (!document.hidden) carregar().catch(() => {}); });
carregar().catch(e => { document.getElementById("atualizado").textContent = "Não consegui carregar os dados (" + e.message + "). Tente recarregar."; });
</script>
<script>
// ---------- aba Ganhos (dados criptografados; so abrem com a senha) ----------
const CHAVE_SENHA = "vi-painel-senha";
const guardar = { ler(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
                  salvar(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const R$ = v => (v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const diaBR = d => d.toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo" });
const chaveDia = d => d.toLocaleDateString("sv-SE", { timeZone: "America/Sao_Paulo" }); // AAAA-MM-DD

function mostrarAba(nome) {
  for (const n of ["posts", "ganhos"]) {
    document.getElementById("aba-" + n).hidden = n !== nome;
    document.getElementById("tab-" + n).setAttribute("aria-selected", n === nome);
  }
  guardar.salvar("vi-aba", nome);
  if (nome === "ganhos") { const s = guardar.ler(CHAVE_SENHA); if (s && document.getElementById("ganhos").hidden) abrirGanhos(s, true); }
}

async function decifrar(pacote, senha) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  const chave = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(pacote.sal), iterations: pacote.iter },
                                              base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const texto = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(pacote.iv) }, chave, b64(pacote.dados));
  return JSON.parse(new TextDecoder().decode(texto));
}

function situacao(s) {
  s = String(s || "").toLowerCase();
  if (/cancel|invalid|fraud|refund|reemb|devol|fail/.test(s)) return "canc";
  if (/complet|conclu|paid|valid|settled/.test(s)) return "ok";
  return "pend";
}
const NOME_SIT = { ok: "✅ Concluída", pend: "⏳ Pendente", canc: "✖ Cancelada" };
const NOME_CANAL = { tg: "Telegram", bio: "Link na bio (Instagram/Facebook)", "": "Sem etiqueta (links antigos)" };
const ganho = c => c.comissao || c.estimada || c.itens.reduce((a, i) => a + (i.comissao || 0), 0);

async function abrirGanhos(senha, lembrar) {
  const erro = document.getElementById("erro-senha");
  erro.textContent = "Abrindo…";
  let pacote;
  try { pacote = await fetch("ganhos.enc.json?t=" + Date.now()).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  catch (e) { erro.textContent = "Os ganhos ainda não foram gerados. Rode o robô \"Atualizar ganhos da Shopee\" no GitHub."; return; }
  let dados;
  try { dados = await decifrar(pacote, senha); }
  catch (e) { erro.textContent = "Senha incorreta."; guardar.salvar(CHAVE_SENHA, null); return; }
  erro.textContent = "";
  guardar.salvar(CHAVE_SENHA, lembrar ? senha : null);
  document.getElementById("form-senha").hidden = true;
  const caixa = document.getElementById("ganhos");
  caixa.hidden = false;
  GANHOS = dados;
  desenharGanhos(caixa, dados);
}
let GANHOS = null;
function redesenharGanhos() { const cx = document.getElementById("ganhos"); if (GANHOS && !cx.hidden) desenharGanhos(cx, GANHOS); }

function sair() {
  guardar.salvar(CHAVE_SENHA, null); GANHOS = null;
  document.getElementById("ganhos").hidden = true;
  document.getElementById("ganhos").innerHTML = "";
  const f = document.getElementById("form-senha"); f.hidden = false; f.reset();
}

function desenharGanhos(caixa, dados) {
  const conv = (dados.conversoes || []).map(c => Object.assign(c, { quando: new Date((c.compra || 0) * 1000), sit: situacao(c.status || (c.itens[0] || {}).status) }));
  const validas = conv.filter(c => c.sit !== "canc");
  const agora = new Date(), hoje = chaveDia(agora), mes = hoje.slice(0, 7);
  const ha7 = new Date(agora - 7 * 864e5);
  const soma = l => l.reduce((a, c) => a + ganho(c), 0);
  const doMes = validas.filter(c => chaveDia(c.quando).startsWith(mes));
  const vendidoMes = doMes.reduce((a, c) => a + c.itens.reduce((b, i) => b + (i.pago || 0) - (i.reembolso || 0), 0), 0);

  // por situacao (90 dias)
  const porSit = { ok: 0, pend: 0, canc: 0 }, qtdSit = { ok: 0, pend: 0, canc: 0 };
  conv.forEach(c => { porSit[c.sit] += ganho(c); qtdSit[c.sit]++; });

  // por dia (30 dias)
  const dias = [];
  for (let i = 29; i >= 0; i--) { const d = new Date(agora - i * 864e5); dias.push({ k: chaveDia(d), d, v: 0, n: 0 }); }
  const idx = Object.fromEntries(dias.map((d, i) => [d.k, i]));
  validas.forEach(c => { const i = idx[chaveDia(c.quando)]; if (i != null) { dias[i].v += ganho(c); dias[i].n++; } });

  // produtos e categorias (90 dias, sem canceladas)
  const prod = {}, cat = {}, canal = {}, cliente = {};
  validas.forEach(c => {
    c.itens.forEach(i => {
      const p = prod[i.id || i.nome] ||= { nome: i.nome, foto: i.foto, qtd: 0, v: 0 };
      p.qtd += i.qtd || 1; p.v += i.comissao || 0;
      const k = i.categoria || "Outros"; cat[k] = (cat[k] || 0) + (i.comissao || 0);
    });
    const ch = NOME_CANAL[c.canal] ? c.canal : (c.canal || "");
    (canal[ch] ||= { v: 0, n: 0 }).v += ganho(c); canal[ch].n++;
    const cl = /new|novo/i.test(c.cliente) ? "novos" : "recorrentes"; cliente[cl] = (cliente[cl] || 0) + 1;
  });
  const topProd = Object.values(prod).sort((a, b) => b.v - a.v).slice(0, 8);
  const topCat = Object.entries(cat).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const maxCat = topCat.length ? topCat[0][1] : 1;
  const canais = Object.entries(canal).sort((a, b) => b[1].v - a[1].v);
  // ganho por post: cada item vendido vai para o post mais recente daquele produto antes da compra
  const pubs = ((DADOS.estado || {}).publicados || []).filter(p => (p.item || {}).itemId).map(p => ({ p, t: new Date(p.em), id: String(p.item.itemId), v: 0, n: 0 }));
  validas.forEach(c => c.itens.forEach(i => {
    const cand = pubs.filter(x => x.id === String(i.id) && x.t <= c.quando && c.quando - x.t < 14 * 864e5).sort((a, b) => b.t - a.t)[0];
    if (cand) { cand.v += i.comissao || 0; cand.n += i.qtd || 1; }
  }));
  const mpG = (DADOS.metricas || {}).posts || {};
  const porPost = pubs.filter(x => x.v > 0).map(x => Object.assign(x, { views: (mpG[x.p.numero] || {}).views })).sort((a, b) => b.v - a.v).slice(0, 10);
  const porHoraG = { 11: 0, 15: 0, 20: 0 };
  pubs.forEach(x => { const h = +((x.p.chave || "").split(" ")[1] || "0").slice(0, 2); if (h in porHoraG) porHoraG[h] += x.v; });
  const maxHG = Math.max(0.01, ...Object.values(porHoraG));
  caixa.innerHTML = `
    <div class="topo-ganhos"><div class="meta">Dados da Shopee · atualizado ${fmt(new Date(dados.gerado))} · últimos ${dados.dias} dias</div>
      <button class="btn-sair" onclick="sair()">🔒 Fechar</button></div>
    <div class="kpis">
      ${[[R$(soma(validas.filter(c => chaveDia(c.quando) === hoje))), "ganhos hoje"],
         [R$(soma(validas.filter(c => c.quando >= ha7))), "últimos 7 dias"],
         [R$(soma(doMes)), "este mês"],
         [doMes.length, "pedidos no mês"],
         [R$(vendidoMes), "vendido pelos seus links (mês)"],
         [doMes.length ? R$(soma(doMes) / doMes.length) : "—", "comissão média por pedido"]]
        .map(([v, t]) => `<div class="kpi"><b>${v}</b><span>${t}</span></div>`).join("")}
    </div>
    <h2>💳 Situação das comissões (90 dias)</h2>
    <p class="meta" style="margin-top:-6px">Pendente = aguardando o cliente receber · Concluída = confirmada pela Shopee · Cancelada = não será paga</p>
    <div class="status">
      <div class="cartao st-pend"><b>${R$(porSit.pend)}</b><span>⏳ Pendente<br>${qtdSit.pend} pedidos</span></div>
      <div class="cartao st-ok"><b>${R$(porSit.ok)}</b><span>✅ Concluída<br>${qtdSit.ok} pedidos</span></div>
      <div class="cartao st-canc"><b>${R$(porSit.canc)}</b><span>✖ Cancelada<br>${qtdSit.canc} pedidos</span></div>
    </div>
    <h2>📈 Ganhos por dia (30 dias)</h2>
    <div class="cartao grafico" id="grafico"></div>
    <h2>🎬 Ganho por post</h2>
    <p class="meta" style="margin-top:-6px">Vendas do produto em até 14 dias depois do post (produtos da Shopee).</p>
    <div class="lista">${porPost.map((x, i) => `<div class="item">
        ${x.p.foto ? `<img src="${esc(x.p.foto)}" alt="" loading="lazy">` : "<span></span>"}
        <div><div class="nome">${i + 1}. nº ${x.p.numero} · ${esc(x.p.produto)}</div>
          <div class="meta">${fmt(x.t)} · ${x.n} vendido${x.n === 1 ? "" : "s"}${x.views ? ` · 👁 ${Number(x.views).toLocaleString("pt-BR")}` : ""}</div>
          ${x.views ? `<div class="com">${R$(x.v / x.views * 1000)} a cada 1.000 visualizações</div>` : ""}</div>
        <div class="dir valor">${R$(x.v)}</div></div>`).join("") || `<div class="vazio">Ainda não há vendas ligadas a um post.</div>`}</div>
    <h2>🕐 Horário que mais vende</h2>
    <div class="cartao barras-h">${Object.entries(porHoraG).map(([h, v]) => `<div class="linha"><span>${h}h</span><span class="valor">${R$(v)}</span>
        <div class="trilho"><i style="width:${v ? Math.max(2, v / maxHG * 100) : 0}%"></i></div></div>`).join("")}</div>
    <h2>🏆 Produtos que mais renderam</h2>    <div class="lista">${topProd.map((p, i) => `<div class="item">
        ${p.foto ? `<img src="${esc(p.foto)}" alt="" loading="lazy">` : "<span></span>"}
        <div><div class="nome">${i + 1}. ${esc(p.nome)}</div><div class="meta">${p.qtd} vendido${p.qtd === 1 ? "" : "s"}</div></div>
        <div class="dir valor">${R$(p.v)}</div></div>`).join("") || `<div class="vazio">Nenhuma venda ainda.</div>`}</div>
    <h2>🗂️ Categorias</h2>
    <div class="cartao barras-h">${topCat.map(([n, v]) => `<div class="linha"><span>${esc(n)}</span><span class="valor">${R$(v)}</span>
        <div class="trilho"><i style="width:${Math.max(2, v / maxCat * 100)}%"></i></div></div>`).join("") || `<div class="vazio">—</div>`}</div>
    <h2>📣 De onde vieram as vendas</h2>
    <div class="status">${canais.map(([k, c]) => `<div class="cartao"><b>${R$(c.v)}</b><span>${esc(NOME_CANAL[k] || k)} · ${c.n} pedido${c.n === 1 ? "" : "s"}</span></div>`).join("") || `<div class="vazio">—</div>`}</div>
    <p class="meta">Clientes: ${cliente.novos || 0} novos na Shopee · ${cliente.recorrentes || 0} que já compravam.</p>
    <h2>🧾 Últimos pedidos</h2>
    <div class="lista">${conv.slice(0, 20).map(c => { const i = c.itens[0] || {}; return `<div class="item">
        ${i.foto ? `<img src="${esc(i.foto)}" alt="" loading="lazy">` : "<span></span>"}
        <div><div class="nome">${esc(i.nome || "Pedido")}${c.itens.length > 1 ? ` <span class="tag">+${c.itens.length - 1} itens</span>` : ""}</div>
          <div class="meta">${fmt(c.quando)} · ${R$(c.itens.reduce((a, x) => a + (x.pago || 0), 0))} · <span class="pill ${c.sit}">${NOME_SIT[c.sit]}</span></div></div>
        <div class="dir valor">${R$(ganho(c))}</div></div>`; }).join("") || `<div class="vazio">Nenhuma venda nos últimos ${dados.dias} dias.</div>`}</div>`;
  desenharGrafico(document.getElementById("grafico"), dias);
}

function desenharGrafico(el, dias, rotulo, titulo) {
  rotulo = rotulo || (d => `<b>${d.d.toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit", month: "2-digit", timeZone: "America/Sao_Paulo" })}</b> · ${R$(d.v)} · ${d.n} pedido${d.n === 1 ? "" : "s"}`);
  // desenha no tamanho real da tela (sem esticar as letras)
  const L = Math.max(280, Math.round(el.clientWidth - 28)), A = 200, m = { e: 40, d: 6, t: 12, b: 24 };
  const max = Math.max(1, ...dias.map(d => d.v));
  const passo = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000].find(p => max / p <= 4) || 1000;
  const topo = Math.ceil(max / passo) * passo;
  const w = (L - m.e - m.d) / dias.length, y = v => A - m.b - (v / topo) * (A - m.b - m.t);
  let svg = `<svg viewBox="0 0 ${L} ${A}" width="${L}" height="${A}" role="img" aria-label="${titulo || "Ganhos por dia nos últimos 30 dias"}">`;
  for (let v = 0; v <= topo; v += passo)
    svg += `<line x1="${m.e}" x2="${L - m.d}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grade)" stroke-width="1"/>
            <text x="${m.e - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--suave)">${v.toLocaleString("pt-BR")}</text>`;
  dias.forEach((d, i) => {
    const x = m.e + i * w, h = A - m.b - y(d.v);
    if (d.v > 0) {
      const bw = Math.max(2, w - 2), r = Math.min(4, bw / 2, h);
      svg += `<path d="M${x + 1},${A - m.b} V${y(d.v) + r} q0,-${r} ${r},-${r} H${x + 1 + bw - r} q${r},0 ${r},${r} V${A - m.b} Z" fill="var(--barra)"/>`;
    }
    svg += `<rect class="alvo" data-i="${i}" x="${x}" y="${m.t}" width="${w}" height="${A - m.t - m.b}" fill="transparent"/>`;
    if ((dias.length - 1 - i) % 7 === 0)  // uma data por semana, terminando em hoje
      svg += `<text x="${x + w / 2}" y="${A - 6}" text-anchor="middle" font-size="11" fill="var(--suave)">${d.d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", timeZone: "America/Sao_Paulo" })}</text>`;
  });
  svg += `<line x1="${m.e}" x2="${L - m.d}" y1="${A - m.b}" y2="${A - m.b}" stroke="var(--suave)" stroke-width="1"/></svg>`;
  el.innerHTML = svg + `<div class="dica"></div>`;
  const dica = el.querySelector(".dica");
  el.querySelectorAll(".alvo").forEach(r => {
    const mostrar = ev => {
      const d = dias[+r.dataset.i], caixa = el.getBoundingClientRect(), alvo = r.getBoundingClientRect();
      dica.innerHTML = rotulo(d);
      dica.style.left = Math.min(Math.max(alvo.left - caixa.left + alvo.width / 2, 80), caixa.width - 80) + "px";
      dica.style.top = (alvo.top - caixa.top + 30) + "px";
      dica.style.display = "block";
    };
    r.addEventListener("mouseenter", mostrar); r.addEventListener("click", mostrar);
    r.addEventListener("mouseleave", () => dica.style.display = "none");
  });
}

if (guardar.ler("vi-aba") === "ganhos") mostrarAba("ganhos");
</script>

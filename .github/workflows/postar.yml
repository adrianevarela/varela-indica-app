name: Postar no Instagram

on:
  schedule:
    # 11h, 15h e 20h de Brasilia (= 14h, 18h e 23h UTC). O GitHub pode atrasar alguns minutos,
    # por isso roda de novo 30 min depois: se ja postou, a segunda vez nao faz nada.
    - cron: "2 14,18,23 * * *"
    - cron: "32 14,18,23 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "simular = so mostra legendas; video = so monta o video para baixar e ouvir; teste = posta agora o item escolhido"
        type: choice
        options: [simular, video, normal, teste]
        default: simular
      item:
        description: "Numero do item da fila (modos video e teste)"
        default: "1"

permissions:
  contents: write

concurrency:
  group: postar
  cancel-in-progress: false

jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q edge-tts
      - name: Postar
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          case "${{ inputs.modo }}" in
            simular) python postar.py --simular ;;
            video)   python postar.py --video "${{ inputs.item }}" ;;
            teste)   python postar.py --teste "${{ inputs.item }}" ;;
            *)       python postar.py ;;
          esac
      - name: Previa para baixar (modo video)
        if: ${{ inputs.modo == 'video' }}
        uses: actions/upload-artifact@v4
        with:
          name: previa-video
          path: previa/
      - name: Guardar o que foi postado
        if: ${{ inputs.modo != 'video' }}
        run: |
          git config user.name "varela-indica-bot"
          git config user.email "bot@users.noreply.github.com"
          git add estado.json docs/index.html
          git diff --cached --quiet || (git commit -m "Postados $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')" && git pull --rebase && git push)

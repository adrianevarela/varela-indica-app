name: Completar fila com a Shopee

# Todo dia as 6h (Brasilia): horarios sem produto nos proximos 3 dias ganham um achadinho da Shopee.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "simular = so mostra o que escolheria; completar = preenche a fila; campos = mostra o que a API da Shopee informa"
        type: choice
        options: [simular, completar, campos]
        default: simular

permissions:
  contents: write

concurrency:
  group: postar
  cancel-in-progress: false

jobs:
  completar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar produtos na Shopee
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
        run: |
          case "${{ inputs.modo }}" in
            simular) python buscar_shopee.py --simular ;;
            campos)  python buscar_shopee.py --campos ;;
            *)       python buscar_shopee.py ;;
          esac
      - name: Guardar a fila
        run: |
          git config user.name "varela-indica-bot"
          git config user.email "bot@users.noreply.github.com"
          git add fila.json
          git diff --cached --quiet || (git commit -m "Shopee completou a fila" && git pull --rebase && git push)

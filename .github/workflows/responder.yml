name: Responder EU QUERO

# Acionado a cada 10 minutos pelo despertador (cron-job.org). O agendamento abaixo e so reserva.
on:
  schedule:
    - cron: "*/20 10-23,0-2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: responder
  cancel-in-progress: false

jobs:
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Responder comentarios
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python responder.py
      - name: Guardar
        run: |
          git config user.name "varela-indica-bot"
          git config user.email "bot@users.noreply.github.com"
          git add respostas.json
          git diff --cached --quiet && exit 0
          git commit -m "Respostas EU QUERO"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done

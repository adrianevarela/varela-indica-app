name: Atualizar metricas dos posts

# A cada 3 horas: visualizacoes, curtidas, alcance, seguidores, cliques no link da bio, membros do Telegram.
on:
  schedule:
    - cron: "45 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: postar
  cancel-in-progress: false

jobs:
  metricas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar metricas
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python metricas.py
      - name: Guardar
        run: |
          git config user.name "varela-indica-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/metricas.json
          git diff --cached --quiet || (git commit -m "Metricas atualizadas" && git pull --rebase && git push)

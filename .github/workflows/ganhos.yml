name: Atualizar ganhos da Shopee

# 4x por dia (9h, 13h, 17h e 22h de Brasilia) busca vendas e comissoes e guarda CRIPTOGRAFADO.
on:
  schedule:
    - cron: "10 12,16,20 * * *"
    - cron: "10 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: postar
  cancel-in-progress: false

jobs:
  ganhos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar vendas
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
        run: |
          pip install -q cryptography
          python ganhos_shopee.py
      - name: Guardar
        run: |
          git config user.name "varela-indica-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/ganhos.enc.json
          git diff --cached --quiet || (git commit -m "Ganhos atualizados" && git pull --rebase && git push)
